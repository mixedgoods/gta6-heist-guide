name: GTA 6 Auto-Sync Intel Database

on:
  schedule:
    # Autonomous continuous sync: refreshes vehicles, characters, weapons, locations, photos & YouTube wire every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Allows instant manual trigger from the GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Image Processing Dependencies
        run: pip install --quiet pillow

      - name: Run GTA 6 Autonomous Intel & Photo Sync Engine
        run: python scripts/auto_sync_gta6_database.py --verify

      - name: Commit & Push Updates
        id: git_sync
        run: |
          git config --global user.name "GTA6 Intel Bot"
          git config --global user.email "bot@gta6heistguide.com"
          git add public/data/gta6_master_intel.json public/assets/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No new GTA 6 intel updates detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git commit -m "chore(sync): auto-update GTA 6 characters, vehicles, weapons & verified photos"
            git push
          fi

      - name: Deploy Updated Site to Cloudflare Pages (when configured)
        if: ${{ (steps.git_sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && env.CF_TOKEN != '' && env.CF_ACCOUNT != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./public --project-name=gta6heistguide --commit-dirty=true
