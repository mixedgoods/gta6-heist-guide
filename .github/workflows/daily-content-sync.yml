name: GTA 6 Daily Launch Sync, Databases & Sitemap Auto-Update ($0/Month)

on:
  schedule:
    # Runs daily at 06:00 UTC on GitHub's free tier ($0/month)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # 1-click manual trigger anytime

jobs:
  sync-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daily Launch Feed, Databases & Sitemap Sync
        run: |
          python scripts/daily_launch_sync.py

      - name: Run Secrets, Cryptids, Radio & Map Pins Auto-Sync
        run: |
          node scripts/sync-secrets-and-radio.mjs

      - name: Run Safe Daily Wildlife Text & Pending-Image Sync
        run: |
          node scripts/sync-animals.mjs

      - name: Commit & Push Discoveries
        id: git_sync
        run: |
          git config --global user.name "GTA6 Intel Auto-Sync Bot"
          git config --global user.email "bot@gta6heistguide.com"
          git add data/ public/data/ public/sitemap.xml
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No new discoveries or sitemap changes detected in this cycle."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git commit -m "chore(daily-sync): refresh live-feed, wildlife text/pending-images JSON & sitemap lastmod"
            git push
          fi

      - name: Deploy to Cloudflare Pages (when configured)
        if: ${{ (steps.git_sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && env.CF_TOKEN != '' && env.CF_ACCOUNT != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./public --project-name=gta6heistguide --commit-dirty=true
