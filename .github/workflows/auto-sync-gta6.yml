name: GTA 6 12-Hour Intel, Cheats & Patch Auto-Sync

on:
  schedule:
    # Runs every 12 hours on GitHub's free servers ($0/month)
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # Manual 1-click trigger

jobs:
  auto-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run 12-Hour Intel, Cheats & Patch Sync
        run: |
          python sync_gta6_intel.py

      - name: Run IndexNow Instant Crawler Ping
        run: |
          python indexnow_ping.py

      - name: Commit & Push Changes
        id: git_sync
        run: |
          git config --global user.name "GTA6 Intel Auto-Sync Bot"
          git config --global user.email "bot@gta6heistguide.com"
          git add public/data/live_intel.json
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in live intel feed."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git commit -m "chore(intel): 12-hour auto-sync GTA 6 cheats, patches & drops"
            git push
          fi

      - name: Deploy to Cloudflare Pages (when configured)
        if: ${{ (steps.git_sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && env.CF_TOKEN != '' && env.CF_ACCOUNT != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./public --project-name=gta6heistguide --commit-dirty=true
