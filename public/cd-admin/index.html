  <style>
    body{padding:1rem;}
    .adm{max-width:1200px;margin:0 auto;display:grid;gap:1rem;}
    .tabs{display:flex;flex-wrap:wrap;gap:.4rem;}
    .tabs button{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);color:#cbd5e1;border-radius:999px;padding:.35rem .8rem;font-size:.76rem;font-weight:700;cursor:pointer;}
    .tabs button.on{background:rgba(0,240,255,.18);border-color:var(--neon-cyan);color:#fff;}

    .warn{color:var(--neon-yellow);}
    .sec{border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:.7rem .9rem;margin-bottom:.7rem;}
    .sec h3{margin:0 0 .4rem;font-size:.85rem;color:var(--neon-cyan);}
    .kv{display:grid;grid-template-columns:150px 1fr;gap:.2rem .6rem;font-size:.8rem;color:#e2e8f0;}
    .kv span:nth-child(odd){color:#94a3b8;}
    .kv span{white-space:pre-wrap;overflow-wrap:anywhere;}
    .acts{display:grid;gap:.5rem;}
    .acts label{display:grid;gap:.2rem;font-size:.78rem;color:#cbd5e1;}
    .acts input,.acts textarea,.acts select{width:100%;box-sizing:border-box;}
    .btns{display:flex;flex-wrap:wrap;gap:.4rem;}
    .btns button{padding:.4rem .8rem;font-size:.76rem;}
    #msg{font-size:.82rem;min-height:1.2rem;}
    .ok{color:var(--neon-green);} .bad{color:#f87171;}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.72rem;color:#94a3b8;margin:0;}
