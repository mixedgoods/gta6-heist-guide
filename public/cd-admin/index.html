<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moderation — GTA6HeistGuide</title>
  <link rel="stylesheet" href="/assets/style.css?v=20261122_v23">
  <style>
    body{padding:1rem;background:#0a0e17;color:#e2e8f0;}
    .adm{max-width:1160px;margin:0 auto;display:grid;gap:.85rem;}
    .adm-hdr{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem;padding:.75rem 1rem;}
    .adm-hdr h1{margin:0;color:#fff;font-size:1.2rem;}
    .adm-hdr small{color:#94a3b8;font-size:.76rem;}
    #msg{font-size:.86rem;font-weight:600;min-height:1.4rem;padding:0;border-radius:8px;transition:all .15s;}
    #msg.ok{color:#4ade80;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);padding:.55rem .85rem;}
    #msg.bad{color:#fca5a5;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.35);padding:.55rem .85rem;}
    .tabs{display:flex;flex-wrap:wrap;gap:.45rem;}
    .tabs button{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);color:#cbd5e1;border-radius:999px;padding:.42rem .95rem;font-size:.82rem;font-weight:700;cursor:pointer;min-height:38px;}
    .tabs button:hover{border-color:rgba(0,240,255,.5);color:#fff;}
    .tabs button.on{background:rgba(0,240,255,.18);border-color:var(--neon-cyan);color:#fff;}
    .cols{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:1rem;align-items:start;}
    @media (max-width:820px){.cols{grid-template-columns:1fr;}}
    .row{padding:.65rem .8rem;border:1px solid rgba(255,255,255,.12);border-radius:8px;margin-bottom:.45rem;cursor:pointer;color:#e2e8f0;font-size:.84rem;background:rgba(255,255,255,.02);}
    .row:hover,.row.on{border-color:var(--neon-cyan);background:rgba(0,240,255,.06);}
    .row-title{font-weight:700;color:#fff;margin-bottom:.2rem;}
    .row small{color:#94a3b8;display:block;font-size:.75rem;line-height:1.35;}
    .warn{color:var(--neon-yellow);font-size:.8rem;margin:.3rem 0;}
    .sec{border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:.85rem 1rem;margin-bottom:.75rem;background:rgba(15,23,42,.55);}
    .sec h2{margin:0 0 .35rem;font-size:1.05rem;color:#fff;}
    .sec h3{margin:0 0 .5rem;font-size:.84rem;color:var(--neon-cyan);text-transform:uppercase;letter-spacing:.04em;}
    .action-bar{display:flex;flex-wrap:wrap;align-items:center;gap:.55rem;margin-top:.7rem;padding-top:.7rem;border-top:1px solid rgba(255,255,255,.1);}
    .btn-approve{background:#15803d;border:1px solid #22c55e;color:#fff;font-weight:700;padding:.52rem 1.1rem;border-radius:8px;font-size:.85rem;cursor:pointer;min-height:40px;}
    .btn-approve:hover:not(:disabled){background:#16a34a;}
    .btn-reject{background:#991b1b;border:1px solid #ef4444;color:#fff;font-weight:700;padding:.52rem 1.1rem;border-radius:8px;font-size:.85rem;cursor:pointer;min-height:40px;}
    .btn-reject:hover:not(:disabled){background:#b91c1c;}
    .btn-neutral{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);color:#e2e8f0;font-weight:600;padding:.5rem .95rem;border-radius:8px;font-size:.83rem;cursor:pointer;min-height:40px;}
    .btn-neutral:hover:not(:disabled){background:rgba(255,255,255,.14);color:#fff;}
    button:disabled{opacity:.55;cursor:not-allowed;}
    .more-wrap{position:relative;margin-left:auto;}
    .more-menu{position:absolute;right:0;top:calc(100% + 4px);min-width:210px;background:#0f172a;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:.3rem;display:grid;gap:.2rem;z-index:20;box-shadow:0 10px 28px rgba(0,0,0,.55);}
    .more-menu[hidden]{display:none;}
    .more-menu button{text-align:left;background:transparent;border:0;color:#e2e8f0;padding:.5rem .7rem;border-radius:6px;font-size:.82rem;cursor:pointer;}
    .more-menu button:hover{background:rgba(0,240,255,.14);color:#fff;}
    .status-pill{display:inline-block;padding:.18rem .55rem;border-radius:999px;font-size:.73rem;font-weight:700;background:rgba(255,255,255,.1);color:#e2e8f0;margin-right:.4rem;}
    .status-pill.pub{background:rgba(34,197,94,.2);color:#86efac;}
    .status-pill.rej{background:rgba(239,68,68,.2);color:#fca5a5;}
    .kv{display:grid;grid-template-columns:145px 1fr;gap:.28rem .7rem;font-size:.82rem;color:#e2e8f0;}
    @media (max-width:520px){.kv{grid-template-columns:1fr;gap:.1rem;}}
    .kv span:nth-child(odd){color:#94a3b8;font-weight:600;}
    .kv span{white-space:pre-wrap;overflow-wrap:anywhere;}
    .acts{display:grid;gap:.55rem;}
    .acts label{display:grid;gap:.22rem;font-size:.8rem;color:#cbd5e1;}
    .acts input,.acts textarea,.acts select{width:100%;box-sizing:border-box;background:#0b1220;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:.45rem .6rem;font-size:.84rem;}
    .acts label.chk{display:flex;align-items:center;gap:.45rem;}
    .acts label.chk input{width:auto;}
    .btns{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.3rem;}
    details.sec-fold{border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:.75rem 1rem;margin-bottom:.75rem;background:rgba(15,23,42,.4);}
    details.sec-fold summary{cursor:pointer;font-size:.84rem;font-weight:700;color:var(--neon-cyan);text-transform:uppercase;letter-spacing:.04em;}
    details.sec-fold .fold-body{margin-top:.65rem;}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.73rem;color:#94a3b8;margin:.25rem 0 0;}
    .modal-backdrop{position:fixed;inset:0;background:rgba(2,6,23,.78);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:100;}
    .modal-backdrop[hidden]{display:none;}
    .modal-card{width:100%;max-width:460px;background:#0f172a;border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:1.1rem 1.2rem;box-shadow:0 20px 50px rgba(0,0,0,.65);display:grid;gap:.75rem;}
    .modal-card h2{margin:0;font-size:1.05rem;color:#fff;}
    .modal-desc{margin:0;font-size:.84rem;color:#cbd5e1;line-height:1.45;}
    .modal-err{color:#fca5a5;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.35);border-radius:6px;padding:.45rem .65rem;font-size:.82rem;}
    .modal-err[hidden]{display:none;}
    .modal-actions{display:flex;justify-content:flex-end;gap:.55rem;margin-top:.2rem;}
  </style>
</head>
<body>
<div class="adm">
  <header class="tool-box adm-hdr">
    <div>
      <h1>Community Discoveries — Moderation</h1>
      <small>Protected by Cloudflare Access</small>
    </div>
  </header>
  <div id="msg" role="status" aria-live="polite"></div>
  <nav class="tabs" id="tabs" aria-label="Submission queues"></nav>
  <div class="cols">
    <section id="list" aria-label="Submissions list"></section>
    <section id="detail" aria-label="Submission details"><div class="sec">Select a submission from the list to review it.</div></section>
  </div>
</div>
<div id="modal-backdrop" class="modal-backdrop" hidden>
  <div id="modal-card" class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
</div>
<script src="/assets/community/cd-admin.js?v=20261124_v2"></script>
</body>
</html>
