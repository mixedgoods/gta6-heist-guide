     <ellipse cx="122" cy="190" rx="30" ry="48" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
     <ellipse cx="278" cy="190" rx="30" ry="48" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
     <text x="122" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="900" fill="#e2e8f0">L</text>
     <text x="278" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="900" fill="#e2e8f0">R</text>
