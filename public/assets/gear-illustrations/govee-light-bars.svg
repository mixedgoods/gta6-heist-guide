  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="115" fill="#ff2a8d" opacity="0.06"/>
  <ellipse cx="200" cy="256" rx="122" ry="14" fill="#000000" opacity="0.35"/>
  <g filter="url(#shadow)">
    <rect x="116" y="96" width="168" height="114" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2.5"/>
     <rect x="64" y="78" width="22" height="156" rx="11" fill="url(#accent)" stroke="#e2e8f0" stroke-width="1.5"/>
     <rect x="314" y="78" width="22" height="156" rx="11" fill="url(#accent)" stroke="#e2e8f0" stroke-width="1.5"/>
     <ellipse cx="75" cy="238" rx="22" ry="7" fill="#334155"/>
     <ellipse cx="325" cy="238" rx="22" ry="7" fill="#334155"/>
     <rect x="180" y="210" width="40" height="24" rx="3" fill="#334155"/>
  </g>
  <rect x="110" y="24" width="180" height="24" rx="12" fill="#9d174d"/>
  <text x="200" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.6" fill="#ffffff">RGBIC AMBIENT BARS</text>
