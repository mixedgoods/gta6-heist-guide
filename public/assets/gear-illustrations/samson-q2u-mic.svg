     <polygon points="180,132 220,132 212,216 188,216" fill="url(#chassis)" stroke="#64748b" stroke-width="2"/>
     <rect x="194" y="156" width="12" height="24" rx="4" fill="#38bdf8"/>
     <path d="M200 216 L154 252 M200 216 L246 252 M200 216 L200 256" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
