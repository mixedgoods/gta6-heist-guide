<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Wireless PC Gaming Mouse Category Illustration">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#172038"/>
      <stop offset="68%" stop-color="#0d1324"/>
      <stop offset="100%" stop-color="#070b14"/>
    </radialGradient>
    <linearGradient id="chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="115" fill="#00f0ff" opacity="0.06"/>
  <ellipse cx="200" cy="256" rx="122" ry="14" fill="#000000" opacity="0.35"/>
  <g filter="url(#shadow)">
    <rect x="148" y="76" width="104" height="164" rx="52" fill="url(#chassis)" stroke="#00f0ff" stroke-width="2.5"/>
     <line x1="200" y1="76" x2="200" y2="144" stroke="#475569" stroke-width="2.5"/>
     <rect x="194" y="102" width="12" height="28" rx="6" fill="#00f0ff"/>
     <circle cx="200" cy="192" r="14" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  </g>
  <rect x="110" y="24" width="180" height="24" rx="12" fill="#3730a3"/>
  <text x="200" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.6" fill="#ffffff">250H WIRELESS MOUSE</text>
</svg>
