<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Asymmetric Monitor-Mounted LED Light Bar Category Illustration">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#172038"/>
      <stop offset="68%" stop-color="#0d1324"/>
      <stop offset="100%" stop-color="#070b14"/>
    </radialGradient>
    <linearGradient id="chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="115" fill="#f59e0b" opacity="0.06"/>
  <ellipse cx="200" cy="256" rx="122" ry="14" fill="#000000" opacity="0.35"/>
  <g filter="url(#shadow)">
    <rect x="70" y="106" width="260" height="132" rx="8" fill="#0f172a" stroke="#475569" stroke-width="3"/>
     <rect x="82" y="118" width="236" height="108" rx="4" fill="#172554"/>
     <polygon points="96,102 304,102 340,248 60,248" fill="#fde047" opacity="0.14"/>
     <rect x="88" y="88" width="224" height="18" rx="9" fill="url(#chassis)" stroke="#f59e0b" stroke-width="2"/>
     <rect x="182" y="76" width="36" height="28" rx="5" fill="#334155" stroke="#64748b" stroke-width="2"/>
     <rect x="176" y="238" width="48" height="14" rx="3" fill="#334155"/>
  </g>
  <rect x="110" y="24" width="180" height="24" rx="12" fill="#b45309"/>
  <text x="200" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.6" fill="#ffffff">ANTI-GLARE LIGHT BAR</text>
