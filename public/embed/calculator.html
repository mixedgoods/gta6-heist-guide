<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compact Heist Cut Splitter | GTA 6 Heist Guide Embed Widget</title>
  <style>
    :root {
      --neon-cyan: #00f0ff;
      --neon-green: #00ff9d;
      --neon-pink: #ff2a8d;
      --neon-amber: #f59e0b;
      --bg-dark: #070a12;
      --card-bg: rgba(11, 18, 30, 0.94);
      --font-mono: 'Courier New', Courier, monospace;
      --font-main: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: #e2e8f0;
      font-family: var(--font-main);
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
    }
    body.obs-mode {
      background: transparent !important;
      padding: 6px;
    }
    .calc-box {
      background: var(--card-bg);
      border: 1px solid var(--neon-cyan);
      border-radius: 10px;
      padding: 14px 16px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }
    body.obs-mode .calc-box {
      background: rgba(6, 10, 18, 0.86);
      border: 1px solid rgba(0, 240, 255, 0.5);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.35);
      backdrop-filter: blur(6px);
    }
    .calc-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding-bottom: 6px;
    }
    .calc-title {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--neon-cyan);
      letter-spacing: 1px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    label {
      font-size: 0.7rem;
      color: #94a3b8;
      display: block;
      margin-bottom: 2px;
      text-transform: uppercase;
      font-family: var(--font-mono);
    }
    select {
      width: 100%;
      background: #0f172a;
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: #fff;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 0.76rem;
      font-family: var(--font-mono);
      outline: none;
    }
    select:focus {
      border-color: var(--neon-cyan);
    }
    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
      background: rgba(0, 0, 0, 0.35);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .res-item {
      text-align: center;
    }
    .res-label {
      font-size: 0.65rem;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .res-val {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 900;
      color: #fff;
      margin-top: 2px;
    }
    .res-val.green { color: var(--neon-green); }
    .res-val.cyan { color: var(--neon-cyan); }
    .res-val.amber { color: var(--neon-amber); }
    .footer-watermark {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.68rem;
      font-family: var(--font-mono);
    }
    .footer-watermark a {
      color: #64748b;
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-watermark a:hover {
      color: var(--neon-cyan);
    }
  </style>
</head>
<body>
  <div class="calc-box">
    <div class="calc-top">
      <span class="calc-title">💰 COMPACT HEIST CUT SPLITTER</span>
      <span style="font-size:0.68rem; color:var(--neon-green); font-family:var(--font-mono); font-weight:800;">LIVE MATH</span>
    </div>

    <div class="form-row">
      <div>
        <label for="vaultTarget">Heist Target</label>
        <select id="vaultTarget" onchange="calculate()">
          <option value="25000000" data-name="Leonida Gold Reserve">Leonida Reserve ($25M)</option>
          <option value="11800000" data-name="Starlet Superyacht">Starlet Yacht ($11.8M)</option>
          <option value="9750000" data-name="Grassrivers 1.5X" selected>Grassrivers 1.5X ($9.75M)</option>
          <option value="9400000" data-name="Ocean Drive Convoy">Ocean Drive ($9.4M)</option>
          <option value="14500000" data-name="Sinfrontera Bank">Sinfrontera Bank ($14.5M)</option>
          <option value="8200000" data-name="Port Gellhorn">Port Gellhorn ($8.2M)</option>
        </select>
      </div>
      <div>
        <label for="playerCount">Crew Size</label>
        <select id="playerCount" onchange="calculate()">
          <option value="1">1 Player (Solo)</option>
          <option value="2" selected>2 Players (Duo)</option>
          <option value="3">3 Players (Trio)</option>
          <option value="4">4 Players (Squad)</option>
        </select>
      </div>
    </div>

    <div class="results-grid">
      <div class="res-item">
        <div class="res-label">Gross Vault Loot</div>
        <div class="res-val" id="grossDisplay">$9,750,000</div>
      </div>
      <div class="res-item">
        <div class="res-label">Hired NPC Cut (25%)</div>
        <div class="res-val amber" id="crewCutDisplay">$2,437,500</div>
      </div>
      <div class="res-item">
        <div class="res-label">Total Squad Take</div>
        <div class="res-val cyan" id="squadTakeDisplay">$7,312,500</div>
      </div>
      <div class="res-item">
        <div class="res-label">Per Player Net Take</div>
        <div class="res-val green" id="perPlayerDisplay">$3,656,250</div>
      </div>
    </div>

    <div class="footer-watermark">
      <span id="rateSummary" style="color:var(--neon-green); font-weight:700;">$2,437,500 / hr (Est.)</span>
      <a href="https://www.gta6heistguide.com/calculator.html?utm_source=embed_calc" target="_blank" rel="noopener">⚡ Powered by GTA6HeistGuide.com</a>
    </div>
  </div>

  <script>
    const isObs = window.location.search.includes('obs=1') || window.location.search.includes('transparent=1');
    if (isObs) document.body.classList.add('obs-mode');

    function calculate() {
      const gross = Number(document.getElementById('vaultTarget').value) || 9750000;
      const players = Number(document.getElementById('playerCount').value) || 2;
      const crewCutRate = 0.25; // 25% hired crew total
      const crewCut = gross * crewCutRate;
      const squadTake = gross - crewCut;
      const perPlayer = squadTake / players;
      const estPerHour = (squadTake / (players * 1.5)); // Approx 90 min prep + finale

      document.getElementById('grossDisplay').textContent = '$' + gross.toLocaleString();
      document.getElementById('crewCutDisplay').textContent = '-$' + Math.round(crewCut).toLocaleString();
      document.getElementById('squadTakeDisplay').textContent = '$' + Math.round(squadTake).toLocaleString();
      document.getElementById('perPlayerDisplay').textContent = '$' + Math.round(perPlayer).toLocaleString() + (players > 1 ? ` (${Math.round(100/players)}%)` : '');
      document.getElementById('rateSummary').textContent = '$' + Math.round(estPerHour).toLocaleString() + '/hr (Net)';
    }

    calculate();
  </script>
</body>
</html>
